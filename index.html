<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#235347" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Krrish's Khaata</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">

      <!-- ===== HOME SCREEN ===== -->
      <div id="homeScreen">
        <header class="app-header">
          <div class="header-top">
            <h1>Krrish's Khaata</h1>
            <div class="header-actions">
              <button class="header-icon-btn" id="summaryBtn" title="Summary">📊</button>
              <button class="header-icon-btn" id="settingsBtn" title="Settings">⚙️</button>
            </div>
          </div>
          <p class="app-subtitle">Your personal household expense log</p>
        </header>

        <section class="summary-card">
          <div class="summary-row">
            <div class="summary-item">
              <span class="summary-label">This Month</span>
              <span class="summary-total" id="monthTotal">₹0</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-item">
              <span class="summary-label">Transactions</span>
              <span class="summary-total" id="monthCount">0</span>
            </div>
          </div>
        </section>

        <section class="source-section">
          <h2>Payment Source</h2>
          <div class="source-grid" id="sourceGrid">
          </div>
        </section>

        <section class="recent-section">
          <div class="section-header">
            <h2>Recent Transactions</h2>
            <button class="view-all-btn" id="viewAllBtn">View All</button>
          </div>
          <div id="recentList">
            <div class="empty-state">
              <span class="empty-icon">📝</span>
              <p>No transactions yet</p>
              <p class="empty-hint">Tap a payment source above to add one</p>
            </div>
          </div>
        </section>
      </div>

      <!-- ===== ALL TRANSACTIONS SCREEN ===== -->
      <div id="allTxnScreen" class="screen-hidden">
        <header class="app-header">
          <div class="header-top">
            <button class="back-btn" id="backToHome">← Back</button>
            <h1>All Transactions</h1>
            <div class="header-actions">
            <button class="header-icon-btn" id="stmtBtn" title="Download Statement">📄</button>
            <button class="header-icon-btn" id="calcModeBtn" title="Calculator">🧮</button>
</div>
          </div>
        </header>

        <section class="search-section">
          <div class="search-bar">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search by name, item, amount, platform..." />
            <button class="search-clear" id="searchClear">✕</button>
          </div>
        </section>

        <section class="filter-section">
          <div class="filter-row">
            <div class="filter-field">
              <label>Month</label>
              <select id="filterMonth"></select>
            </div>
            <div class="filter-field">
              <label>Source</label>
              <select id="filterSource">
                <option value="all">All Sources</option>
              </select>
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-field">
              <label>Category</label>
              <select id="filterCategory">
                <option value="all">All Categories</option>
                <option value="household">🏠 Household</option>
                <option value="personal_other">👤 Someone's Personal</option>
                <option value="personal_self">🙋 My Personal</option>
                <option value="direct_credit">🤝 Direct Credit</option>
              </select>
            </div>
            <div class="filter-field">
              <label>Status</label>
              <select id="filterStatus">
                <option value="all">All</option>
                <option value="unmatched">Unmatched / Unsettled</option>
                <option value="matched">Matched / Settled</option>
              </select>
            </div>
          </div>
        </section>

        <section class="all-txn-summary">
          <div class="summary-row">
            <div class="summary-item">
              <span class="summary-label">Filtered Total</span>
              <span class="summary-total" id="filteredTotal">₹0</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-item">
              <span class="summary-label">Count</span>
              <span class="summary-total" id="filteredCount">0</span>
            </div>
            <div class="summary-divider"></div>
            <div class="summary-item">
              <span class="summary-label">Pending</span>
              <span class="summary-total summary-warn" id="unmatchedCount">0</span>
            </div>
          </div>
        </section>

        <section class="txn-list-section">
          <div id="allTxnList"></div>
        </section>

        <!-- Calculator Mode Floating Bar -->
        <div id="calcBar" class="calc-bar calc-bar-hidden">
          <div class="calc-bar-info">
            <span id="calcCount">0 selected</span>
            <span id="calcTotal" class="calc-total">₹0</span>
          </div>
          <button class="calc-done-btn" id="calcDoneBtn">Done</button>
        </div>
      </div>

    </div>

    <button class="fab" id="fabBtn" title="Add Transaction">+</button>

    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
  </body>
</html>
